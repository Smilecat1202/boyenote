name: Build Desktop (from relay source)

# 公开仓 Actions 正常（私有代码仓 Actions 不运行）。
# 源码不进公开仓：CI 经 relay /source（RELAY_TOKEN 鉴权）拉取私有源码包，
# 原生构建 Windows x64 / macOS，再经 relay /upload 回传 Gitee 发布物仓。
on: # rebuild-marker-1
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        type: choice
        default: all
        options: [all, windows, macos]
  push:
    branches: [main]
    paths: ['.github/workflows/build-desktop.yml']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: windows
          - label: macos-universal
            os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      - name: Select target
        id: sel
        shell: bash
        run: |
          req="${{ github.event.inputs.target || 'all' }}"
          if [ "$req" != "all" ] && [ "$req" != "${{ matrix.target }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sel.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        if: steps.sel.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        if: steps.sel.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: build/src-tauri

      - name: Fetch source from relay
        if: steps.sel.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p build
          curl -sS --fail --retry 3 -H "Authorization: Bearer e66c6af6e85bad5a063b4f1d8e9f45b26f96250eb8f28a68" \
            "https://relay.boyenote.com/source" -o build/src.tar.gz
          tar -xzf build/src.tar.gz -C build
          rm build/src.tar.gz
          ls build | head

      - name: Build Windows sidecar
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'windows'
        shell: pwsh
        working-directory: build
        run: powershell -ExecutionPolicy Bypass -File scripts/build-sidecar-windows.ps1

      - name: Install frontend deps
        if: steps.sel.outputs.skip != 'true'
        shell: bash
        working-directory: build
        run: npm ci

      - name: Build Windows x64
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'windows'
        shell: bash
        working-directory: build
        run: npm run tauri build -- --ci

      - name: Build macOS sidecar (both arches)
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'macos'
        shell: bash
        working-directory: build
        run: bash scripts/build-sidecar.sh mac

      - name: Build macOS universal
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'macos'
        shell: bash
        working-directory: build
        run: npm run tauri build -- --ci --target universal-apple-darwin

      - name: Upload Windows installer to Gitee (via relay)
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'windows'
        shell: bash
        working-directory: build
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          curl -sS --fail --retry 3 -X POST "https://relay.boyenote.com/upload" \
            -H "Authorization: Bearer e66c6af6e85bad5a063b4f1d8e9f45b26f96250eb8f28a68" \
            -F "file=@$EXE" \
            -F "tag=v0.4.69-beta" \
            -F "name=拨叶笔记 0.4.69 内测版" \
            -F "body=Windows x64 内测版。Intel/AMD 原生运行，ARM 版 Win11 经 x64 模拟。" \
            -F "prerelease=true"

      - name: Upload macOS DMG to Gitee (via relay)
        if: steps.sel.outputs.skip != 'true' && matrix.target == 'macos'
        shell: bash
        working-directory: build
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "no universal DMG"; exit 1; fi
          curl -sS --fail --retry 3 -X POST "https://relay.boyenote.com/upload" \
            -H "Authorization: Bearer e66c6af6e85bad5a063b4f1d8e9f45b26f96250eb8f28a68" \
            -F "file=@$DMG" \
            -F "tag=v0.4.69-beta" \
            -F "name=拨叶笔记 0.4.69 内测版" \
            -F "body=macOS universal 内测版（Intel + Apple Silicon 通吃）。" \
            -F "prerelease=true"
